schema: spec-driven

# Project context — shown to AI when creating artifacts.
context: |
  产品愿景:tally 是一个装进 Agent 的个人记账能力包,最终形态是一个 plugin =
  tally-mcp + skill + command + agent + hook。tally-mcp 只是其中的"事实内核"——一个纯 MCP
  server,提供个人记账业务逻辑,不做 REST API、不做前端 UI;对话就是唯一的 UI。本仓库当前
  只包含 tally-mcp 这一部分。一句话边界:tally 管"你的钱记成了什么",不管"你这个人是
  什么样"。定位语:你的钱是一个你能拿走的文件(单文件 SQLite)。

  三层结构(每层归属不同,互不越界):
  - 事实层 → tally-mcp(SQLite):交易、来源、分类、账本。永远算得对;能从事实推导的
    不另存(余额现算是同一哲学)。
  - 实践层 → plugin 的 skill/command/agent/hook:记账最佳实践、约定、交互流程,随插件分发。
  - 习惯层 → 用户 Agent 自己的记忆(harness 的 MEMORY.md 等):个人偏好。存储与召回永远
    不归 tally 管,也不引入外部记忆基础设施(如 Memory MCP);skill 顶多教 Agent"什么时候
    该写一条习惯"。换 Agent = 换助理,忘掉旧习惯是合理的;迁移是 Agent 生态的问题。

  两条分界判据:
  - 进 mcp 的功能:只有"必须在全量数据上、用 DB 的速度算才正确"的东西(汇总、趋势、
    跨期对账)。"取一批数据出来让模型自己想"能做的(预算建议、异常点评、消费画像)
    一律归 skill + Agent 记忆,不进服务端。
  - 习惯跟着它描述的对象走:关于账本数据的习惯(商户→分类映射、常用来源)不是记忆,
    是账本自身的投影,从交易历史现算(先例检索,依赖将来的 keyword 过滤);关于用户
    本人的偏好(语言、记账风格)归 Agent 侧记忆。

  关键实践约定(属实践层:skill 教、hook 守,服务端不感知也不强制):
  - comment 纪律:记录/导入时把原始凭据文本(账单原文、商户原名)写进 comment,此后
    任何修正只动结构化字段(分类/来源/金额),永不改写 comment。这样每笔交易自带
    "原文 vs 解释"两层,keyword 一搜即得先例(导入时是什么、用户改成了什么)。
  - 记录流程:Agent 记录前先搜先例 → 在对话里给出 preview → 用户确认/修改后写入。
    这个 preview 是纯对话预览(skill 侧),与服务端 confirmation_token 两步确认无关;
    后者仍只用于破坏性操作。create_transaction 保持单步直写。

  plugin 组件分工判据(供将来设计 plugin 时用):
  - command = 给"仪式"命名 + 功能货架:只装固定节奏、重复、较长的流程(setup / import /
    review 之类);"记一笔"这类短、随机、对话式操作绝不做成 command。
  - agent = 海拔隔离:仅当子任务的工作材料会污染主对话(如账单解析细节)才拆 agent。
  - hook = 实践的强制执行:只执法机械可判定的规则(如 comment 不可变卫兵);语义判断
    永远归 skill/对话。克制用量,优先 PreToolUse 精准拦截。

  多账本语义:ledger 是单个用户名下、为某个目的(某段旅行、某类特殊花费)单独建立的
  交易合集——语义分组,不是权限边界。将来若做多用户,用户边界是另一个新概念("Agent
  时代"的认证),不挪用 ledger。

  集成方式:存储与业务逻辑层完全自建,不依赖 ezbookkeeping(或任何其他记账库)作为 Go module。
  `internal/store` 下手写 SQL(`schema.sql`/`queries.sql`),用 sqlc 在构建期生成类型安全的查询代码,
  不引入 ORM;SQLite 驱动用纯 Go 的 modernc.org/sqlite,不需要 cgo。没有独立的迁移框架——只有一个
  schema 版本,靠 `CREATE TABLE IF NOT EXISTS` 一次性建好。MCP 协议层(JSON-RPC 解析、工具注册、传输)
  同样完全自研,不依赖任何记账库的协议实现。

  数据模型:没有"用户"概念——不设 uid 列,不在启动时 bootstrap 任何用户。ledger 是显式
  实体,每次调用显式传 ledger_id,服务端不持有"当前账本"。账户余额不作为存储字段,查询时
  对交易表 `SUM(amount)` 现算,结构上消除"余额与流水对不上"的可能。不做任何时区处理——
  时间字段一直是纯 Unix 秒数,协议里从未暴露过时区语义。金额校验用一份手工维护、对齐真实
  ISO 4217 标准的静态币种表(代码 → 小数位数),按币种真实小数位数处理(例如日元 0 位、
  科威特第纳尔 3 位),不是不管什么币种都固定按两位小数换算。

  用户模型:单用户,面向个人使用,极度简化。不实现传统认证机制(注册、邮箱验证、
  密码重置、2FA、多会话管理)。为未来可能的多用户重新设计留扩展空间,但那将采用"Agent 时代"的
  认证方式,不是现在这套传统 web 认证。

  传输与认证:HTTP 传输;认证用单个静态 bearer token,不做 JWT/OAuth,不做签发/过期/撤销机制。

  结构性配置数据(账本、来源、分类)的增删改,全部通过 MCP 工具暴露,不做独立的 CLI
  管理通道——因为没有前端,MCP 工具是这些数据唯一的管理入口。

  写操作安全机制:只有批量操作和破坏性操作(比如删账本、删来源、删分类、删交易)要求
  preview → apply 两步确认;单条记录的增/改直接执行,不强制二次确认(MCP 客户端自身的
  调用确认已经够用于单条操作)。

  明确排除、不在本项目实现的能力(Agent 侧即可完成,或与极简方向冲突):
  - AI 图片识别记账(拍照自动识别金额/商家——Claude 自己读图即可,不需要服务端再调一次外部 LLM)
  - 图片附件存储(小票照片)
  - 定期交易/模板自动调度(需要常驻后台 cron 循环,和"极简"方向冲突)
  - 外部记忆基础设施(Memory MCP 等——习惯层归 Agent,见上)

  延后(方向已定,但现在不做,也不要 propose):
  - keyword 过滤:search_transactions 按 comment 子串过滤(`LIKE` 即可,个人账本量级
    不需要 FTS)。基础特性,先例检索依赖它,时机到了再 propose。
  - 批量导入/导出:自用阶段不需要;若将来推向多用户则必做。形态已定:mcp 侧一个
    app 无关的 batch_create_transactions(preview → apply),plugin 侧每 APP 一个解析
    脚本,解析走代码不走 Agent 上下文,Agent 只看摘要与异常清单。
  - 可视化:skill + templates 动态生成 artifacts;何种可视化适合本项目尚未研究。此后
    设计分析类工具时,返回结构以"能直接喂给模板"为准。
  - plugin 化落地(skill/command/agent/hook):等推广时机。

