<!doctype html>
<meta charset="utf-8" />
<title>Transaction timeline</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #8a8a8e;
    --line: #e8e8ea;
    --row-hover: #f5f5f7;
    --income: #1a7f4b;
    --pos: #b23c3c;
    color-scheme: light;
  }
  :root.dark {
    --bg: #1c1c1e;
    --fg: #f2f2f7;
    --muted: #98989f;
    --line: #38383a;
    --row-hover: #2c2c2e;
    --income: #34c77b;
    --pos: #ff6b6b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  /* An author `display` (e.g. .pager's flex) otherwise beats the UA's
     [hidden] rule, so `el.hidden = true` would silently not hide it. */
  [hidden] { display: none !important; }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
  }
  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
  header button {
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
  }
  header button:hover { color: var(--fg); }
  /* The scope this panel was opened with -- always visible, sticky under the
     header. Its height is published as --scopebar-h so day labels stack below. */
  .scopebar {
    position: sticky;
    top: 41px;
    z-index: 1;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px;
    padding: 5px 16px;
    overflow-wrap: anywhere;
  }
  .scopebar:empty { display: none; }
  /* Never rely on the [hidden] attribute for anything an author rule sets
     `display` on (see .filterbar below) -- use this class instead. */
  .is-hidden { display: none !important; }
  .day { padding: 0 16px; }
  .day-label {
    position: sticky;
    top: calc(41px + var(--scopebar-h, 0px));
    background: var(--bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 10px 0 4px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .day-total {
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
  }
  .row:hover { background: var(--row-hover); }
  .row .time {
    flex: none;
    width: 3.4em;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .row .body { flex: 1; min-width: 0; }
  .row .right { flex: none; text-align: right; white-space: nowrap; }
  .row .desc { overflow-wrap: anywhere; }
  .row .sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 1px;
    overflow-wrap: anywhere;
  }
  .row .amount {
    font-variant-numeric: tabular-nums;
    color: var(--pos);
  }
  .row.income .amount { color: var(--income); }
  .empty {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 24px 16px;
  }
  .pager {
    position: sticky;
    bottom: 0;
    background: var(--bg);
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 8px 16px;
  }
  .pager button {
    font: inherit;
    font-size: 12px;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 10px;
    cursor: pointer;
    white-space: nowrap;
  }
  .pager button:hover:not(:disabled) { background: var(--row-hover); }
  .pager button:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
  .pager .pageinfo {
    color: var(--muted);
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    min-width: 6.5em;
    text-align: center;
  }
  #filterToggle::after { content: "▾"; margin-left: 5px; font-size: 9px; vertical-align: 1px; }
  #filterToggle[aria-expanded="true"]::after { content: "▴"; }
  #filterToggle.active { color: var(--fg); border-color: var(--fg); }
  #filterToggle.active::before {
    content: "";
    display: inline-block;
    width: 5px; height: 5px;
    margin-right: 5px;
    border-radius: 50%;
    background: var(--fg);
    vertical-align: 1px;
  }
  /* Toggled by the .open class only -- never rely on the [hidden] attribute
     here: this rule's `display` would defeat the UA [hidden] style in some
     browsers, so the bar is display:none by default and flex only when open. */
  .filterbar {
    display: none;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 8px 12px;
  }
  .filterbar.open { display: flex; }
  .filterbar .field {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 11px;
    color: var(--muted);
  }
  .filterbar input[type="date"],
  .filterbar select {
    font: inherit;
    font-size: 12px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 6px;
    max-width: 10em;
  }
  /* Read-only stand-in for a dropdown whose value the scope has fixed. */
  .filterbar .tag {
    font-size: 12px;
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 4px 8px;
    max-width: 14em;
    overflow-wrap: anywhere;
  }
  .filterbar .actions {
    display: flex;
    gap: 8px;
    margin-left: auto;
  }
  .filterbar button {
    font: inherit;
    font-size: 12px;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .filterbar button:disabled { color: var(--muted); opacity: 0.5; cursor: default; }
</style>

<header>
  <h1>交易时间线</h1>
  <span class="meta" id="meta"></span>
  <button id="filterToggle" type="button" aria-expanded="false" aria-controls="filterBar">筛选</button>
  <button id="expand" hidden>全屏</button>
</header>
<div class="scopebar" id="scopeBar"></div>
<div class="filterbar" id="filterBar">
  <label class="field">从<input type="date" id="filterStart"></label>
  <label class="field">到<input type="date" id="filterEnd"></label>
  <label class="field" id="catField">分类<select id="filterCat"><option value="">不限分类</option></select></label>
  <div class="field is-hidden" id="catTagField">分类<span class="tag" id="catTag"></span></div>
  <label class="field" id="srcField">来源<select id="filterSrc"><option value="">不限来源</option></select></label>
  <div class="field is-hidden" id="srcTagField">来源<span class="tag" id="srcTag"></span></div>
  <div class="actions">
    <button type="button" id="filterReset">重置</button>
  </div>
</div>
<main id="main"><div class="empty" id="boot">加载中…</div></main>
<footer class="pager" id="pager" hidden>
  <button id="firstBtn" type="button">« 页首</button>
  <button id="prevBtn" type="button">‹ 上一页</button>
  <span class="pageinfo" id="pageinfo"></span>
  <button id="nextBtn" type="button">下一页 ›</button>
  <button id="lastBtn" type="button">页尾 »</button>
</footer>

<script type="module">
/*__EXT_APPS_BUNDLE__*/
// Everything runs inside this IIFE: the claude.ai apps sandbox splices the
// widget in via document.write into a shared scope that already declares some
// short identifiers (e.g. `io`), so leaking top-level `const`s breaks the
// whole document write. Keep all names local.
(async () => {
const mainEl = document.getElementById("main");
const metaEl = document.getElementById("meta");
const filterToggle = document.getElementById("filterToggle");
const filterBar = document.getElementById("filterBar");
const filterStart = document.getElementById("filterStart");
const filterEnd = document.getElementById("filterEnd");
const filterCat = document.getElementById("filterCat");
const filterSrc = document.getElementById("filterSrc");
const filterReset = document.getElementById("filterReset");
const scopeBar = document.getElementById("scopeBar");
const catField = document.getElementById("catField");
const catTagField = document.getElementById("catTagField");
const catTag = document.getElementById("catTag");
const srcField = document.getElementById("srcField");
const srcTagField = document.getElementById("srcTagField");
const srcTag = document.getElementById("srcTag");
const pagerEl = document.getElementById("pager");
const pageInfoEl = document.getElementById("pageinfo");
const firstBtn = document.getElementById("firstBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const lastBtn = document.getElementById("lastBtn");

const PAGE_SIZE = 15;

// The shared runtime (globalThis.Tally) owns the host bridge, theme,
// fullscreen button and supersession. It is created synchronously here so
// w.app is reachable from onToolResult even when the host delivers the first
// result during connect(); w.connect() is awaited at the end of this IIFE.
const w = Tally.mountWidget({
  name: "TransactionTimeline",
  version: "1.0.0",
  channel: "tally-transaction-timeline",
  onToolInput,
  onToolResult,
});
function superseded() { return w.isSuperseded(); }

// --- state ---
let ledgerId = null;
let cursor = "";              // search_transactions cursor for the next older chunk
let doneFetching = false;     // server has no more transactions to give
let fetching = false;
let navBusy = false;          // serializes multi-chunk navigation (next / last)
let draining = false;         // background "fetch the whole scope" loop is running
let total = null;             // count of transactions in the scope, reported by the tool result
// The scope this panel was opened with (result.scope), or null when the server
// predates scoping. It is fixed for the life of the panel: only transactions
// inside it are ever loaded, and the filter bar can only narrow within it.
let scope = null;
let pageIdx = 0;              // 0-based current page
const allTxns = [];           // every transaction fetched so far, newest -> oldest

// active filters, re-committed on every filter-input change (no "应用"
// button). Filtering is entirely local over allTxns (the scope's transactions)
// -- start / end are bare "YYYY-MM-DD" strings compared lexically against a
// row's date prefix (see design.md D2), no search_transactions params, no
// network. These are only what the user set in the filter bar; the scope
// itself is never part of them.
let filters = { source_id: "", category_id: "", start: "", end: "" };
let filtersActive = false;

// id -> name lookups. Normally these arrive inside the open_transaction_timeline
// result (D1); loadLookups() is only a fallback for an older server whose
// result carries no categories/sources.
const catById = new Map();        // id -> { name, parentId }
const srcById = new Map();        // id -> name
const childrenByParent = new Map(); // parentId -> [childId, ...], rebuilt on lookup load
let lookupsLoaded = false;

// Rebuild the parentId -> children adjacency from catById. Called whenever
// catById is (re)populated, from either the inline result or the fallback.
function rebuildCategoryTree() {
  childrenByParent.clear();
  for (const [id, c] of catById) {
    const p = c.parentId && c.parentId !== "0" ? String(c.parentId) : "";
    if (!p) continue;
    if (!childrenByParent.has(p)) childrenByParent.set(p, []);
    childrenByParent.get(p).push(String(id));
  }
}

// Every id in the subtree rooted at catId, catId included -- the local
// equivalent of search_transactions' include_descendants=true.
function descendantIdsOf(catId) {
  const out = new Set();
  const stack = [String(catId)];
  while (stack.length) {
    const cur = stack.pop();
    if (out.has(cur)) continue;
    out.add(cur);
    for (const kid of childrenByParent.get(cur) || []) stack.push(kid);
  }
  return out;
}

// t.time is a naive "YYYY-MM-DD HH:MM:SS" local date-time string with no
// timezone marker (see design.md's D1/D5) -- it is never parsed through
// Date(unixSeconds) or Date(isoString), both of which would silently
// reinterpret it in the viewing device's timezone. Grouping and display
// below work directly on the string's fixed-width fields instead.
const dayFmt = new Intl.DateTimeFormat(undefined, { year: "numeric", month: "long", day: "numeric" });
const weekdayFmt = new Intl.DateTimeFormat(undefined, { weekday: "short" });
function dayKeyOf(timeStr) {
  return String(timeStr).slice(0, 10); // "YYYY-MM-DD"
}
function rowTimeOf(timeStr) {
  return String(timeStr).slice(11, 16); // "HH:MM"
}
// dayFmt/weekdayFmt still go through Intl + Date for locale-aware rendering
// (month names, weekday abbreviations), but the Date is built from the
// key's own y/m/d components via the local-component constructor -- which
// treats them as wall-clock values with no timezone conversion -- not by
// parsing the string or an epoch offset.
function formatDay(dayKey) {
  const [y, mo, d] = dayKey.split("-").map(Number);
  const localDate = new Date(y, mo - 1, d);
  return `${dayFmt.format(localDate)} ${weekdayFmt.format(localDate)}`;
}

function fracDigits(s) {
  const i = String(s).indexOf(".");
  return i < 0 ? 0 : String(s).length - i - 1;
}
function fmtAmount(a, currency) {
  return `${a} ${currency}`;
}
function scopeIsSet() {
  return !!scope && !!(scope.start_date || scope.end_date || scope.category_id || scope.source_id);
}

// The scope's filters as search_transactions arguments, taken verbatim from
// the result: the first-page cursor is fingerprinted with exactly these, so
// every later page must repeat them unchanged (and the dates are never
// re-derived here).
function scopeArgs() {
  const a = {};
  if (!scope) return a;
  if (scope.start_time) a.start_time = scope.start_time;
  if (scope.end_time) a.end_time = scope.end_time;
  if (scope.category_id) {
    a.category_id = String(scope.category_id);
    a.include_descendants = !!scope.include_descendants;
  }
  if (scope.source_id) a.source_id = String(scope.source_id);
  return a;
}

function scopeCatText() {
  return `${catLabel(scope.category_id) || `分类 #${scope.category_id}`}（含子分类）`;
}
function scopeSrcText() {
  return srcById.get(String(scope.source_id)) || `来源 #${scope.source_id}`;
}
function scopeText() {
  const parts = [];
  if (scope.start_date && scope.end_date) parts.push(`${scope.start_date} 至 ${scope.end_date}`);
  else if (scope.start_date) parts.push(`${scope.start_date} 起`);
  else if (scope.end_date) parts.push(`截至 ${scope.end_date}`);
  if (scope.category_id) parts.push(scopeCatText());
  if (scope.source_id) parts.push(scopeSrcText());
  return parts.length ? parts.join(" · ") : "全部交易";
}

function setBound(input, attr, value) {
  if (value) input.setAttribute(attr, value); else input.removeAttribute(attr);
}
function syncScopeBarHeight() {
  document.documentElement.style.setProperty("--scopebar-h", scopeBar.textContent ? `${scopeBar.offsetHeight}px` : "0px");
}

// Show the scope: the bar under the header, read-only tags in place of the
// dropdowns the scope has already fixed, and date inputs that cannot leave
// the scope. Safe to call again once the (fallback) lookups arrive, since the
// names in the bar and tags come from them.
function renderScope() {
  scopeBar.textContent = scope ? `范围：${scopeText()}` : "";
  const catLocked = !!(scope && scope.category_id);
  catField.classList.toggle("is-hidden", catLocked);
  catTagField.classList.toggle("is-hidden", !catLocked);
  catTag.textContent = catLocked ? scopeCatText() : "";
  const srcLocked = !!(scope && scope.source_id);
  srcField.classList.toggle("is-hidden", srcLocked);
  srcTagField.classList.toggle("is-hidden", !srcLocked);
  srcTag.textContent = srcLocked ? scopeSrcText() : "";
  for (const input of [filterStart, filterEnd]) {
    setBound(input, "min", scope && scope.start_date);
    setBound(input, "max", scope && scope.end_date);
  }
  syncScopeBarHeight();
}
window.addEventListener("resize", syncScopeBarHeight);

function catLabel(id) {
  const c = catById.get(String(id));
  if (!c) return "";
  const parent = c.parentId && c.parentId !== "0" ? catById.get(String(c.parentId)) : null;
  return parent ? `${parent.name} / ${c.name}` : c.name;
}

// Ingest the categories / sources arrays that ride along in the
// open_transaction_timeline result (D1). Returns true when it found usable
// lookup data, so ontoolresult can skip the network fallback.
function ingestInlineLookups(payload) {
  const cats = payload && payload.categories;
  const srcs = payload && payload.sources;
  if (!Array.isArray(cats) && !Array.isArray(srcs)) return false;
  for (const c of cats || []) catById.set(String(c.id), { name: c.name, parentId: c.parent_id });
  for (const s of srcs || []) srcById.set(String(s.id), s.name);
  rebuildCategoryTree();
  lookupsLoaded = true;
  return catById.size > 0 || srcById.size > 0;
}

async function loadLookups() {
  if (lookupsLoaded || !ledgerId) return;
  lookupsLoaded = true;
  const pull = async (name, key, apply) => {
    try {
      const res = await w.withTimeout(w.app.callServerTool({ name, arguments: { ledger_id: ledgerId } }), 4000);
      let data = res && res.structuredContent;
      if (!data || !Array.isArray(data[key])) {
        const text = res && res.content && res.content[0] && res.content[0].text;
        if (text) { try { data = JSON.parse(text); } catch { /* ignore */ } }
      }
      for (const it of (data && data[key]) || []) apply(it);
    } catch { /* names are optional — degrade to ids */ }
  };
  await Promise.all([
    pull("list_categories", "categories", (c) => catById.set(String(c.id), { name: c.name, parentId: c.parent_id })),
    pull("list_sources", "sources", (s) => srcById.set(String(s.id), s.name)),
  ]);
  rebuildCategoryTree();
}

// Fill the filter dropdowns from the lookups above: top-level categories
// first, each followed by its children indented (category_id filters match
// one exact id, not a parent plus its children, so both levels stay pickable).
function populateFilterOptions() {
  const cats = [...catById.entries()];
  const children = new Map();
  for (const [id, c] of cats) {
    if (c.parentId && c.parentId !== "0") {
      if (!children.has(c.parentId)) children.set(c.parentId, []);
      children.get(c.parentId).push([id, c]);
    }
  }
  const topLevel = cats.filter(([, c]) => !c.parentId || c.parentId === "0");
  topLevel.sort((a, b) => a[1].name.localeCompare(b[1].name));
  filterCat.innerHTML = '<option value="">不限分类</option>';
  for (const [id, c] of topLevel) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = c.name;
    filterCat.append(opt);
    const kids = (children.get(id) || []).sort((a, b) => a[1].name.localeCompare(b[1].name));
    for (const [kid, kc] of kids) {
      const kopt = document.createElement("option");
      kopt.value = kid;
      kopt.textContent = "　" + kc.name;
      filterCat.append(kopt);
    }
  }

  const srcs = [...srcById.entries()].sort((a, b) => a[1].localeCompare(b[1]));
  filterSrc.innerHTML = '<option value="">不限来源</option>';
  for (const [id, name] of srcs) {
    const opt = document.createElement("option");
    opt.value = id;
    opt.textContent = name;
    filterSrc.append(opt);
  }
}

// The current result set: every fetched transaction when no filter is
// active, otherwise the locally filtered subset. Recomputed by refreshView()
// and read by every rendering / paging function below.
let view = allTxns;

// Descendant id set for the active category filter (catId + its whole
// subtree), recomputed only when the filter is committed -- the local
// equivalent of search_transactions' include_descendants=true.
let catFilterIds = null;

function matchesFilters(t) {
  if (filters.source_id && String(t.source_id) !== filters.source_id) return false;
  if (catFilterIds && !catFilterIds.has(String(t.category_id))) return false;
  const day = dayKeyOf(t.time); // "YYYY-MM-DD"; lexical order == chronological
  if (filters.start && day < filters.start) return false;
  if (filters.end && day > filters.end) return false;
  return true;
}

function refreshView() {
  view = filtersActive ? allTxns.filter(matchesFilters) : allTxns;
}

// Net income/expense per day over the current view, so a day label shows the
// true day total even when that day is split across pages.
function computeDayTotals() {
  const m = new Map();
  for (const t of view) {
    const key = dayKeyOf(t.time);
    let cm = m.get(key);
    if (!cm) { cm = new Map(); m.set(key, cm); }
    const amtNum = Number(t.amount) || 0;
    const cur = cm.get(t.currency) || { net: 0, frac: 0 };
    cur.net += t.type === "income" ? amtNum : -amtNum;
    cur.frac = Math.max(cur.frac, fracDigits(t.amount));
    cm.set(t.currency, cur);
  }
  return m;
}

function fmtDayTotal(cm) {
  const parts = [];
  for (const [cur, v] of cm) {
    if (v.net === 0) continue;
    const sign = v.net > 0 ? "+" : "−";
    parts.push(`${sign}${Math.abs(v.net).toFixed(v.frac)} ${cur}`);
  }
  return parts.join("  ");
}

function makeRow(t) {
  const cName = catLabel(t.category_id);
  const sName = srcById.get(String(t.source_id));
  const row = document.createElement("div");
  row.className = "row" + (t.type === "income" ? " income" : "");

  const timeEl = document.createElement("div");
  timeEl.className = "time";
  timeEl.textContent = rowTimeOf(t.time);

  const bodyEl = document.createElement("div");
  bodyEl.className = "body";
  const desc = document.createElement("div");
  desc.className = "desc";
  const descIsCat = !t.comment && !!cName;
  desc.textContent = t.comment || cName || `#${t.id}`;
  bodyEl.append(desc);
  if (cName && !descIsCat) {
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = cName;
    bodyEl.append(sub);
  }

  const rightEl = document.createElement("div");
  rightEl.className = "right";
  const amount = document.createElement("div");
  amount.className = "amount";
  amount.textContent = (t.type === "income" ? "+" : "−") + fmtAmount(t.amount, t.currency);
  rightEl.append(amount);
  if (sName) {
    const ssub = document.createElement("div");
    ssub.className = "sub";
    ssub.textContent = sName;
    rightEl.append(ssub);
  }

  row.append(timeEl, bodyEl, rightEl);
  return row;
}

// How many pages the current view spans, plus one unknown page while the
// background drain may still add older rows.
function pageCount() {
  const byTotal = !filtersActive && total != null ? Math.ceil(total / PAGE_SIZE) : 0;
  const byData = Math.ceil(view.length / PAGE_SIZE) + (doneFetching ? 0 : 1);
  return Math.max(byTotal, byData, 1);
}

function hasNextPage() {
  return (pageIdx + 1) * PAGE_SIZE < view.length || !doneFetching;
}

function renderControls() {
  refreshView();
  pagerEl.hidden = false;
  pageInfoEl.textContent = `第 ${pageIdx + 1} / ${pageCount()} 页`;
  const busy = navBusy;
  firstBtn.disabled = prevBtn.disabled = busy || pageIdx === 0;
  nextBtn.disabled = lastBtn.disabled = busy || !hasNextPage();
}

function renderPage() {
  refreshView();
  mainEl.innerHTML = "";
  if (view.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    if (filtersActive) empty.textContent = "没有符合当前条件的交易";
    else if (scopeIsSet()) empty.textContent = `该范围内没有交易（${scopeText()}）`;
    else empty.textContent = "这个账本还没有交易";
    mainEl.append(empty);
    pagerEl.hidden = true;
    return;
  }
  const rows = view.slice(pageIdx * PAGE_SIZE, pageIdx * PAGE_SIZE + PAGE_SIZE);
  const dayTotals = computeDayTotals();
  let curDayKey = null;
  let curBody = null;
  for (const t of rows) {
    const key = dayKeyOf(t.time);
    if (key !== curDayKey) {
      curDayKey = key;
      const day = document.createElement("section");
      day.className = "day";
      const label = document.createElement("div");
      label.className = "day-label";
      const dname = document.createElement("span");
      dname.textContent = formatDay(key);
      const dtotal = document.createElement("span");
      dtotal.className = "day-total";
      dtotal.textContent = fmtDayTotal(dayTotals.get(key) || new Map());
      label.append(dname, dtotal);
      day.append(label);
      mainEl.append(day);
      curBody = day;
    }
    curBody.append(makeRow(t));
  }
  mainEl.scrollTop = 0;
  window.scrollTo(0, 0);
  renderControls();
}

// Fetch the next older chunk of the scope from the server into allTxns. It
// carries the scope's own filters and nothing else -- the filter bar is
// applied locally over allTxns, so the drain pulls the scope once and every
// later filter change is free. Nothing outside the scope is ever requested.
async function fetchNextChunk() {
  if (fetching || doneFetching || superseded() || !ledgerId) return;
  fetching = true;
  try {
    const args = { ledger_id: ledgerId, newest_first: true, limit: 100, cursor, ...scopeArgs() };
    const res = await w.app.callServerTool({ name: "search_transactions", arguments: args });
    const page = w.parseSearchResult(res);
    allTxns.push(...(page.transactions || []));
    cursor = page.next_cursor || "";
    if (!cursor) doneFetching = true;
  } catch (err) {
    // leave doneFetching false so paging again retries
  } finally {
    fetching = false;
  }
}

// Pull every remaining older transaction of the scope into allTxns. Runs once in the
// background right after the first paint, and is awaited on demand if the
// user pages past what has arrived. Earlier pages never change as older rows
// append, so mid-drain we only refresh the controls; the full repaint waits
// for completion (or an explicit navigation).
let drainPromise = null;
function drainAll() {
  if (drainPromise) return drainPromise; // already running — await the same run
  draining = true;
  drainPromise = (async () => {
    try {
      while (!doneFetching && !superseded()) {
        const before = allTxns.length;
        await fetchNextChunk();
        renderControls();
        if (allTxns.length === before && !doneFetching) break;
      }
    } finally {
      draining = false;
      drainPromise = null;
      renderPage();
    }
  })();
  return drainPromise;
}

async function withNav(fn) {
  if (navBusy) return;
  navBusy = true;
  renderControls();
  try { await fn(); } finally { navBusy = false; renderPage(); }
}

function lastPageIdx() {
  refreshView();
  return Math.max(0, Math.ceil(view.length / PAGE_SIZE) - 1);
}

function updateMeta() {
  if (!metaEl) return;
  if (filtersActive) { refreshView(); metaEl.textContent = `已筛选 · ${view.length} 笔`; }
  else if (total !== null) metaEl.textContent = `共 ${total} 笔`;
  else metaEl.textContent = "";
}

// Re-read the filter-bar inputs and re-render locally. Called on every
// input change -- there is no "应用" button. No network: the whole scope is
// (being) drained into allTxns already, so a filter pass is instant.
function commitFilters() {
  filters = {
    source_id: filterSrc.value,
    category_id: filterCat.value,
    start: filterStart.value, // "YYYY-MM-DD" or ""
    end: filterEnd.value,
  };
  filtersActive = !!(filters.source_id || filters.category_id || filters.start || filters.end);
  catFilterIds = filters.category_id ? descendantIdsOf(filters.category_id) : null;
  filterToggle.classList.toggle("active", filtersActive);
  pageIdx = 0;
  refreshView();
  updateMeta();
  renderPage();
}

filterToggle.addEventListener("click", () => {
  const open = filterBar.classList.toggle("open");
  filterToggle.setAttribute("aria-expanded", open ? "true" : "false");
});
for (const el of [filterStart, filterEnd, filterCat, filterSrc]) {
  el.addEventListener("change", commitFilters);
}
filterReset.addEventListener("click", () => {
  filterStart.value = "";
  filterEnd.value = "";
  filterCat.value = "";
  filterSrc.value = "";
  commitFilters();
});

firstBtn.addEventListener("click", () => { if (!navBusy) { pageIdx = 0; renderPage(); } });
prevBtn.addEventListener("click", () => { if (!navBusy && pageIdx > 0) { pageIdx -= 1; renderPage(); } });
nextBtn.addEventListener("click", () => withNav(async () => {
  if (!doneFetching) await drainAll();
  pageIdx = Math.min(pageIdx + 1, lastPageIdx());
}));
lastBtn.addEventListener("click", () => withNav(async () => {
  if (!doneFetching) await drainAll();
  pageIdx = lastPageIdx();
}));

// --- first paint from the tool result ---
function onToolInput({ arguments: args }) {
  if (args && args.ledger_id) ledgerId = String(args.ledger_id);
}

function onToolResult(result) {
  const payload = w.extractFirstPagePayload(result);
  const txns = Array.isArray(payload.transactions) ? payload.transactions : [];
  total = typeof payload.total === "number" ? payload.total : null;
  // A server that predates scoping sends no scope: treat it as "the whole
  // ledger" and show no scope bar.
  scope = payload.scope && typeof payload.scope === "object" ? payload.scope : null;

  allTxns.length = 0;
  allTxns.push(...txns);
  cursor = payload.next_cursor || "";
  doneFetching = !cursor || txns.length === 0;
  pageIdx = 0;

  // Category / source names ride along in the result (D1): populate the
  // lookups and filter dropdowns synchronously so the first paint already
  // shows names, with no extra request.
  const haveInline = ingestInlineLookups(payload);
  if (haveInline) populateFilterOptions();
  renderScope();
  updateMeta();
  renderPage();

  if (!haveInline) {
    // Older server without the inline lookups — fall back to fetching them.
    loadLookups()
      .then(() => {
        populateFilterOptions();
        renderScope();
        if (catById.size || srcById.size) renderPage();
      })
      .catch(() => { /* names stay as ids */ });
  }

  // Drain the rest of the scope into allTxns so paging and filtering become
  // local. A newer widget instance flips supersession and stops this loop.
  if (!doneFetching) void drainAll();
}

// Bridge callbacks are already installed (mountWidget, above); connecting now
// -- after all wiring -- lets the host deliver the first tool result straight
// into onToolResult. A connect failure has already painted its own message.
try {
  await w.connect();
} catch {
  return;
}
})();
</script>
