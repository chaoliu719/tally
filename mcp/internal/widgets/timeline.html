<!doctype html>
<meta charset="utf-8" />
<title>Transaction timeline</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #8a8a8e;
    --line: #e8e8ea;
    --row-hover: #f5f5f7;
    --income: #1a7f4b;
    --pos: #b23c3c;
    color-scheme: light;
  }
  :root.dark {
    --bg: #1c1c1e;
    --fg: #f2f2f7;
    --muted: #98989f;
    --line: #38383a;
    --row-hover: #2c2c2e;
    --income: #34c77b;
    --pos: #ff6b6b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
  }
  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; }
  header button {
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
  }
  header button:hover { color: var(--fg); }
  .day {
    padding: 0 16px;
  }
  .day-label {
    position: sticky;
    top: 41px;
    background: var(--bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 10px 0 4px;
  }
  .day-total { font-weight: 400; }
  .row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 7px 0;
    border-top: 1px solid var(--line);
  }
  .row .desc { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row .amount {
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    color: var(--pos);
  }
  .row.income .amount { color: var(--income); }
  .row.income .amount::before { content: "+"; }
  .sentinel, .end, .empty {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 16px;
  }
  .end { border-top: 1px solid var(--line); }
</style>

<header>
  <h1>交易时间线</h1>
  <span class="meta" id="meta"></span>
  <button id="expand" hidden>全屏</button>
</header>
<main id="main"></main>
<div class="sentinel" id="sentinel" hidden>加载更早的记录…</div>

<script type="module">
/*__EXT_APPS_BUNDLE__*/
const { App } = globalThis.ExtApps;

const mainEl = document.getElementById("main");
const metaEl = document.getElementById("meta");
const sentinelEl = document.getElementById("sentinel");
const expandBtn = document.getElementById("expand");

const app = new App({ name: "TransactionTimeline", version: "1.0.0" }, {}, { autoResize: true });

// --- supersession: a newer instance of this widget makes older ones stop
// fetching, so a stale panel does not keep hammering the server. ---
let superseded = false;
const seq = Date.now() + Math.random();
try {
  const bc = new BroadcastChannel("tally-transaction-timeline");
  bc.onmessage = (e) => { if (e.data && e.data.seq > seq) superseded = true; };
  bc.postMessage({ seq });
} catch { /* BroadcastChannel unavailable — non-fatal */ }

// --- theme ---
function applyTheme(theme) {
  document.documentElement.classList.toggle("dark", theme === "dark");
}
app.onhostcontextchanged = (ctx) => ctx && applyTheme(ctx.theme);

// --- state ---
let ledgerId = null;
let cursor = "";
let done = false;
let loading = false;
let lastDayKey = null;     // the day-key of the last row appended
let lastDayBodyEl = null;  // the .day container currently being filled
let total = null;

const dayFmt = new Intl.DateTimeFormat(undefined, { year: "numeric", month: "long", day: "numeric", weekday: "short" });
function dayKeyOf(unixSeconds) {
  const d = new Date(unixSeconds * 1000);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function fmtAmount(a, currency) {
  return `${a} ${currency}`;
}

function appendTransactions(txns) {
  for (const t of txns) {
    const key = dayKeyOf(t.time);
    if (key !== lastDayKey) {
      lastDayKey = key;
      const day = document.createElement("section");
      day.className = "day";
      const label = document.createElement("div");
      label.className = "day-label";
      label.textContent = dayFmt.format(new Date(t.time * 1000));
      day.append(label);
      mainEl.append(day);
      lastDayBodyEl = day;
    }
    const row = document.createElement("div");
    row.className = "row" + (t.type === "income" ? " income" : "");
    const desc = document.createElement("span");
    desc.className = "desc";
    desc.textContent = t.comment || `#${t.id}`;
    const amount = document.createElement("span");
    amount.className = "amount";
    amount.textContent = fmtAmount(t.amount, t.currency);
    row.append(desc, amount);
    lastDayBodyEl.append(row);
  }
}

function parseSearchResult(res) {
  if (res && res.structuredContent && Array.isArray(res.structuredContent.transactions)) {
    return res.structuredContent;
  }
  const text = res && res.content && res.content[0] && res.content[0].text;
  if (text) {
    try { return JSON.parse(text); } catch { /* fall through */ }
  }
  return { transactions: [], next_cursor: "" };
}

async function loadMore() {
  if (loading || done || superseded || !ledgerId) return;
  loading = true;
  sentinelEl.hidden = false;
  try {
    const res = await app.callServerTool({
      name: "search_transactions",
      arguments: { ledger_id: ledgerId, newest_first: true, limit: 100, cursor },
    });
    const page = parseSearchResult(res);
    appendTransactions(page.transactions || []);
    cursor = page.next_cursor || "";
    if (!cursor) {
      done = true;
      sentinelEl.hidden = true;
      const end = document.createElement("div");
      end.className = "end";
      end.textContent = "— 已到最早一条 —";
      mainEl.append(end);
    }
  } catch (err) {
    sentinelEl.textContent = "加载失败,滚动重试";
  } finally {
    loading = false;
    if (!done) sentinelEl.hidden = true;
  }
}

// Infinite scroll: load the next page when the sentinel scrolls into view.
const io = new IntersectionObserver((entries) => {
  if (entries.some((e) => e.isIntersecting)) loadMore();
}, { rootMargin: "400px" });
io.observe(sentinelEl);

// --- first paint from the tool result ---
app.ontoolinput = ({ arguments: args }) => {
  if (args && args.ledger_id) ledgerId = String(args.ledger_id);
};

app.ontoolresult = ({ content }) => {
  let payload;
  try {
    const text = content[0].text;
    payload = JSON.parse(text.slice(text.indexOf("\n\n") + 2));
  } catch {
    payload = { transactions: [] };
  }
  const txns = payload.transactions || [];
  total = typeof payload.total === "number" ? payload.total : null;
  if (total !== null) metaEl.textContent = `共 ${total} 笔`;
  mainEl.innerHTML = "";
  lastDayKey = null;
  lastDayBodyEl = null;

  if (txns.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "这个账本还没有交易";
    mainEl.append(empty);
    done = true;
    return;
  }
  appendTransactions(txns);
  cursor = payload.next_cursor || "";
  if (!cursor) {
    done = true;
    const end = document.createElement("div");
    end.className = "end";
    end.textContent = "— 已到最早一条 —";
    mainEl.append(end);
  } else {
    sentinelEl.hidden = false;
  }
};

await app.connect();
applyTheme(app.getHostContext()?.theme);

const ctx = app.getHostContext();
if (ctx?.availableDisplayModes?.includes("fullscreen")) {
  expandBtn.hidden = false;
  expandBtn.addEventListener("click", () => app.requestDisplayMode({ mode: "fullscreen" }));
}
</script>
