<!doctype html>
<meta charset="utf-8" />
<title>Transaction timeline</title>
<style>
  :root {
    --bg: #ffffff;
    --fg: #1c1c1e;
    --muted: #8a8a8e;
    --line: #e8e8ea;
    --row-hover: #f5f5f7;
    --income: #1a7f4b;
    --pos: #b23c3c;
    color-scheme: light;
  }
  :root.dark {
    --bg: #1c1c1e;
    --fg: #f2f2f7;
    --muted: #98989f;
    --line: #38383a;
    --row-hover: #2c2c2e;
    --income: #34c77b;
    --pos: #ff6b6b;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
  }
  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  header h1 { font-size: 14px; font-weight: 600; margin: 0; }
  header .meta { color: var(--muted); font-size: 12px; margin-left: auto; }
  header button {
    font: inherit;
    font-size: 12px;
    color: var(--muted);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 3px 8px;
    cursor: pointer;
  }
  header button:hover { color: var(--fg); }
  .day { padding: 0 16px; }
  .day-label {
    position: sticky;
    top: 41px;
    background: var(--bg);
    color: var(--muted);
    font-size: 12px;
    font-weight: 600;
    padding: 10px 0 4px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .day-total {
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
    border-top: 1px solid var(--line);
  }
  .row:hover { background: var(--row-hover); }
  .row .time {
    flex: none;
    width: 3.4em;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.1;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .row .body { flex: 1; min-width: 0; }
  .row .right { flex: none; text-align: right; white-space: nowrap; }
  .row .desc { overflow-wrap: anywhere; }
  .row .sub {
    color: var(--muted);
    font-size: 12px;
    margin-top: 1px;
    overflow-wrap: anywhere;
  }
  .row .amount {
    font-variant-numeric: tabular-nums;
    color: var(--pos);
  }
  .row.income .amount { color: var(--income); }
  .sentinel, .end, .empty {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    padding: 16px;
  }
  .end { border-top: 1px solid var(--line); }
</style>

<header>
  <h1>交易时间线</h1>
  <span class="meta" id="meta"></span>
  <button id="expand" hidden>全屏</button>
</header>
<main id="main"><div class="empty" id="boot">加载中…</div></main>
<div class="sentinel" id="sentinel" hidden>加载更早的记录…</div>

<script type="module">
/*__EXT_APPS_BUNDLE__*/
// Everything runs inside this IIFE: the claude.ai apps sandbox splices the
// widget in via document.write into a shared scope that already declares some
// short identifiers (e.g. `io`), so leaking top-level `const`s breaks the
// whole document write. Keep all names local.
(async () => {
const { App } = globalThis.ExtApps;

const mainEl = document.getElementById("main");
const bootEl = document.getElementById("boot");
function boot(msg) { if (bootEl) bootEl.textContent = msg; }
function fatal(msg) { mainEl.innerHTML = '<div class="empty">' + msg + "</div>"; }
const metaEl = document.getElementById("meta");
const sentinelEl = document.getElementById("sentinel");
const expandBtn = document.getElementById("expand");

const app = new App({ name: "TransactionTimeline", version: "1.0.0" }, {}, { autoResize: true });

// --- supersession: a newer instance of this widget makes older ones stop
// fetching, so a stale panel does not keep hammering the server. ---
let superseded = false;
const seq = Date.now() + Math.random();
try {
  const bc = new BroadcastChannel("tally-transaction-timeline");
  bc.onmessage = (e) => { if (e.data && e.data.seq > seq) superseded = true; };
  bc.postMessage({ seq });
} catch { /* BroadcastChannel unavailable — non-fatal */ }

// --- theme ---
function applyTheme(theme) {
  document.documentElement.classList.toggle("dark", theme === "dark");
}
app.onhostcontextchanged = (ctx) => ctx && applyTheme(ctx.theme);

// --- state ---
let ledgerId = null;
let cursor = "";
let done = false;
let loading = false;
let total = null;
const allTxns = [];   // every transaction appended so far, in display order

// id -> name lookups, loaded once from the ledger's own read-only tools so
// rows can show category / source names instead of bare ids.
const catById = new Map();   // id -> { name, parentId }
const srcById = new Map();   // id -> name
let lookupsLoaded = false;

// per-day running state, keyed by local-date key
let lastDayKey = null;
let lastDayBodyEl = null;
const dayLabelEls = new Map();     // dayKey -> the .day-total span
const dayAgg = new Map();          // dayKey -> Map(currency -> { net, frac })

const dayFmt = new Intl.DateTimeFormat(undefined, { year: "numeric", month: "long", day: "numeric" });
const weekdayFmt = new Intl.DateTimeFormat(undefined, { weekday: "short" });
function formatDay(d) { return `${dayFmt.format(d)} ${weekdayFmt.format(d)}`; }
const timeFmt = new Intl.DateTimeFormat(undefined, { hour: "2-digit", minute: "2-digit", hour12: false });
function dayKeyOf(unixSeconds) {
  const d = new Date(unixSeconds * 1000);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function fracDigits(s) {
  const i = String(s).indexOf(".");
  return i < 0 ? 0 : String(s).length - i - 1;
}
function fmtAmount(a, currency) {
  return `${a} ${currency}`;
}
function catLabel(id) {
  const c = catById.get(String(id));
  if (!c) return "";
  const parent = c.parentId && c.parentId !== "0" ? catById.get(String(c.parentId)) : null;
  return parent ? `${parent.name} / ${c.name}` : c.name;
}

function withTimeout(promise, ms) {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms)),
  ]);
}

async function loadLookups() {
  if (lookupsLoaded || !ledgerId) return;
  lookupsLoaded = true;
  const pull = async (name, key, apply) => {
    try {
      const res = await withTimeout(app.callServerTool({ name, arguments: { ledger_id: ledgerId } }), 4000);
      let data = res && res.structuredContent;
      if (!data || !Array.isArray(data[key])) {
        const text = res && res.content && res.content[0] && res.content[0].text;
        if (text) { try { data = JSON.parse(text); } catch { /* ignore */ } }
      }
      for (const it of (data && data[key]) || []) apply(it);
    } catch { /* names are optional — degrade to ids */ }
  };
  await Promise.all([
    pull("list_categories", "categories", (c) => catById.set(String(c.id), { name: c.name, parentId: c.parent_id })),
    pull("list_sources", "sources", (s) => srcById.set(String(s.id), s.name)),
  ]);
}

function renderDayTotal(dayKey) {
  const span = dayLabelEls.get(dayKey);
  const agg = dayAgg.get(dayKey);
  if (!span || !agg) return;
  const parts = [];
  for (const [cur, v] of agg) {
    if (v.net === 0) continue;
    const sign = v.net > 0 ? "+" : "−";
    parts.push(`${sign}${Math.abs(v.net).toFixed(v.frac)} ${cur}`);
  }
  span.textContent = parts.join("  ");
}

function appendTransactions(txns) {
  const touchedDays = new Set();
  for (const t of txns) {
    const key = dayKeyOf(t.time);
    if (key !== lastDayKey) {
      lastDayKey = key;
      const day = document.createElement("section");
      day.className = "day";
      const label = document.createElement("div");
      label.className = "day-label";
      const dname = document.createElement("span");
      dname.textContent = formatDay(new Date(t.time * 1000));
      const dtotal = document.createElement("span");
      dtotal.className = "day-total";
      label.append(dname, dtotal);
      day.append(label);
      mainEl.append(day);
      lastDayBodyEl = day;
      dayLabelEls.set(key, dtotal);
      if (!dayAgg.has(key)) dayAgg.set(key, new Map());
    }
    touchedDays.add(key);

    // aggregate the day total (net: income positive, expense negative)
    const agg = dayAgg.get(key);
    const amtNum = Number(t.amount) || 0;
    const cur = agg.get(t.currency) || { net: 0, frac: 0 };
    cur.net += t.type === "income" ? amtNum : -amtNum;
    cur.frac = Math.max(cur.frac, fracDigits(t.amount));
    agg.set(t.currency, cur);

    const row = document.createElement("div");
    row.className = "row" + (t.type === "income" ? " income" : "");
    const cName = catLabel(t.category_id);
    const sName = srcById.get(String(t.source_id));

    // time, leading
    const timeEl = document.createElement("div");
    timeEl.className = "time";
    timeEl.textContent = timeFmt.format(new Date(t.time * 1000));

    // content, with category as the small line beneath it
    const bodyEl = document.createElement("div");
    bodyEl.className = "body";
    const desc = document.createElement("div");
    desc.className = "desc";
    const descIsCat = !t.comment && !!cName;
    desc.textContent = t.comment || cName || `#${t.id}`;
    bodyEl.append(desc);
    if (cName && !descIsCat) {
      const sub = document.createElement("div");
      sub.className = "sub";
      sub.textContent = cName;
      bodyEl.append(sub);
    }

    // amount, with source as the small line beneath it
    const rightEl = document.createElement("div");
    rightEl.className = "right";
    const amount = document.createElement("div");
    amount.className = "amount";
    amount.textContent = (t.type === "income" ? "+" : "−") + fmtAmount(t.amount, t.currency);
    rightEl.append(amount);
    if (sName) {
      const ssub = document.createElement("div");
      ssub.className = "sub";
      ssub.textContent = sName;
      rightEl.append(ssub);
    }

    row.append(timeEl, bodyEl, rightEl);
    lastDayBodyEl.append(row);
  }
  for (const key of touchedDays) renderDayTotal(key);
}

// Full repaint from allTxns. Used for the first page and again once the
// category/source name lookups resolve, so rows never block on them.
function renderAll() {
  mainEl.innerHTML = "";
  lastDayKey = null;
  lastDayBodyEl = null;
  dayLabelEls.clear();
  dayAgg.clear();
  if (allTxns.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "这个账本还没有交易";
    mainEl.append(empty);
    return;
  }
  appendTransactions(allTxns);
  if (done) {
    const end = document.createElement("div");
    end.className = "end";
    end.textContent = "— 已到最早一条 —";
    mainEl.append(end);
  }
}

function parseSearchResult(res) {
  if (res && res.structuredContent && Array.isArray(res.structuredContent.transactions)) {
    return res.structuredContent;
  }
  const text = res && res.content && res.content[0] && res.content[0].text;
  if (text) {
    try { return JSON.parse(text); } catch { /* fall through */ }
  }
  return { transactions: [], next_cursor: "" };
}

async function loadMore() {
  if (loading || done || superseded || !ledgerId) return;
  loading = true;
  sentinelEl.hidden = false;
  try {
    const res = await app.callServerTool({
      name: "search_transactions",
      arguments: { ledger_id: ledgerId, newest_first: true, limit: 100, cursor },
    });
    const page = parseSearchResult(res);
    const more = page.transactions || [];
    allTxns.push(...more);
    appendTransactions(more);
    cursor = page.next_cursor || "";
    if (!cursor) {
      done = true;
      sentinelEl.hidden = true;
      const end = document.createElement("div");
      end.className = "end";
      end.textContent = "— 已到最早一条 —";
      mainEl.append(end);
    }
  } catch (err) {
    sentinelEl.textContent = "加载失败,滚动重试";
  } finally {
    loading = false;
    if (!done) sentinelEl.hidden = true;
  }
}

// Infinite scroll: load the next page when the sentinel scrolls into view.
const scrollWatcher = new IntersectionObserver((entries) => {
  if (entries.some((e) => e.isIntersecting)) loadMore();
}, { rootMargin: "400px" });
scrollWatcher.observe(sentinelEl);

// --- first paint from the tool result ---
app.ontoolinput = ({ arguments: args }) => {
  if (args && args.ledger_id) ledgerId = String(args.ledger_id);
};

// The open_transaction_timeline result can reach the widget a few different
// ways depending on the host: as structuredContent, as a text block that is
// "<summary>\n\n<json>", or as bare JSON. Try all of them.
function extractFirstPagePayload(result) {
  const sc = result && result.structuredContent;
  if (sc && (Array.isArray(sc.transactions) || typeof sc.total === "number")) return sc;
  const content = result && result.content;
  const text = content && content[0] && content[0].text;
  if (typeof text === "string") {
    const i = text.indexOf("\n\n");
    const tries = i >= 0 ? [text.slice(i + 2), text] : [text];
    const m = text.match(/\{[\s\S]*\}/);
    if (m) tries.push(m[0]);
    for (const c of tries) {
      try {
        const o = JSON.parse(c);
        if (o && (Array.isArray(o.transactions) || typeof o.total === "number")) return o;
      } catch { /* next candidate */ }
    }
  }
  return { transactions: [] };
}

app.ontoolresult = (result) => {
  const payload = extractFirstPagePayload(result);
  const txns = Array.isArray(payload.transactions) ? payload.transactions : [];
  total = typeof payload.total === "number" ? payload.total : null;
  if (total !== null && metaEl) metaEl.textContent = `共 ${total} 笔`;

  allTxns.push(...txns);
  cursor = payload.next_cursor || "";
  done = !cursor || txns.length === 0;

  // Paint the list right away — do not wait on the name lookups.
  renderAll();
  sentinelEl.hidden = done;

  // Enrich rows with category / source names in the background; repaint once
  // when they arrive. A slow or unavailable lookup never blocks the timeline.
  loadLookups()
    .then(() => { if (catById.size || srcById.size) renderAll(); })
    .catch(() => { /* names stay as ids */ });
};

boot("连接中…");
try {
  await app.connect();
} catch (err) {
  fatal("连接宿主失败:" + (err && err.message ? err.message : err));
  return;
}
boot("已连接,等待数据…");
applyTheme(app.getHostContext()?.theme);

const ctx = app.getHostContext();
if (ctx?.availableDisplayModes?.includes("fullscreen")) {
  expandBtn.hidden = false;
  expandBtn.addEventListener("click", () => app.requestDisplayMode({ mode: "fullscreen" }));
}
})();
</script>
